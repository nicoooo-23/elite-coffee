<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <title>Menu | Elite Coffee</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="/">Elite Coffee</a>
    <nav>
      <a href="/">Home</a>
      <a href="/menu">Menu</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>
  <main>
    <h1 class="center">Our Menu</h1>
    <form id="filter" class="filter">
      <label>Category
        <select id="category"><option value="">All</option><option value="hot">Hot</option><option value="iced">Iced</option></select>
      </label>
      <label>Max price (PHP)
        <input id="maxPrice" type="number" min="0" placeholder="e.g. 130">
      </label>
    </form>
    <section id="menu-grid" class="grid"></section>
    <script src="/js/menu.js"></script>
  </main>
</body>
</html>
